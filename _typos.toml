[files]
# Generated by Tapioca from the source of third-party gems: their spelling is upstream's.
extend-exclude = ["sorbet/rbi/gems/", "sorbet/rbi/annotations/"]

[default.extend-identifiers]
# File::WRONLY, the POSIX "write only" open flag.
WRONLY = "WRONLY"

[default.extend-words]
# RSpec's method that skips an example group, named by the suppression check.
xdescribe = "xdescribe"
