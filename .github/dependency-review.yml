---
# Configuration of the Dependency review job (.github/workflows/security.yml).
comment-summary-in-pr: on-failure
fail-on-severity: low

# Dependencies allowed below the OpenSSF Scorecard threshold. Each one names the exact version and the score it was
# accepted at (a lower score fails again), and the reason. An allowance for a gem version Gemfile.lock no longer has
# fails the check.
scorecard-allowances:
  rubygems/flog:
    reason: >-
      The method complexity gate (`rake flog`, a development-only check) runs it; it is the only Ruby
      implementation of the Flog metric. It is never loaded by the gem itself and not installed for users of
      leechtop_downloader.
    score: 1.5
    version: 4.9.4
  rubygems/ruby-progressbar:
    reason: >-
      RuboCop (a development-only gate) requires it unconditionally (rubocop 1.92.2: ruby-progressbar ~> 1.7),
      so it cannot be dropped or replaced while RuboCop runs. It is never loaded by the gem itself and not
      installed for users of leechtop_downloader.
    score: 2.8
    version: 1.13.0

# OpenSSF Scorecard: every added dependency must score at least this much. dependency-review-action can only change
# its threshold for every package at once, so its own Scorecard report is off and script/scorecard_check.rb
# applies this threshold instead (failing, not just reporting), with the per-package allowances above.
show-openssf-scorecard: false
warn-on-openssf-scorecard-level: 3
...
