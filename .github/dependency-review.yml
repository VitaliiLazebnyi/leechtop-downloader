# Configuration of the Dependency review job (.github/workflows/security.yml).
fail-on-severity: low
comment-summary-in-pr: on-failure

# OpenSSF Scorecard: every added dependency must score at least this much. dependency-review-action can only
# change its threshold for every package at once, so its own Scorecard report is off and
# script/scorecard_check.rb applies this threshold instead (failing, not just reporting), with the per-package
# allowances below.
show-openssf-scorecard: false
warn-on-openssf-scorecard-level: 3

# Dependencies allowed below the threshold. Each one names the exact version and the score it was accepted at
# (a lower score fails again), and the reason. An allowance for a gem version Gemfile.lock no longer has fails
# the check.
scorecard-allowances:
  rubygems/ruby-progressbar:
    version: 1.13.0
    score: 2.8
    reason: >-
      RuboCop (a development-only gate) requires it unconditionally (rubocop 1.92.1: ruby-progressbar ~> 1.7),
      so it cannot be dropped or replaced while RuboCop runs. It is never loaded by the gem itself and not
      installed for users of leechtop_downloader.
