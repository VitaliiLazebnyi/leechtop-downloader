name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '4.0.3'
        bundler-cache: true
        
    - name: Run RSpec (100% Coverage Enforced)
      run: bundle exec rspec
      
    - name: Run RuboCop (Zero Violations Enforced)
      run: bundle exec rubocop
      
    - name: Run Sorbet Type Checking
      run: bundle exec srb tc
