name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby-version: ['3.0', '4.0.0', '4.0.4']
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true
        
    - name: Run RSpec (100% Coverage Enforced)
      run: bundle exec rspec
      
    - name: Run RuboCop (Zero Violations Enforced)
      run: bundle exec rubocop
      
    - name: Run Sorbet Type Checking
      run: bundle exec srb tc

    - name: Generate YARD Documentation
      run: bundle exec yard doc --fail-on-warning

    - name: Build Gem Validation
      run: gem build leechtop_downloader.gemspec
