name: Security

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions: {}

# Ruby warnings are enabled on each step that runs code: `-w` (every warning) for this repository's code, and
# the deprecation and performance categories for the tools. They are not enabled while setup-ruby installs the
# gems, where RubyGems' own installer is the only code that runs.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundler-audit:
    name: bundler-audit
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
      with:
        ruby-version: .ruby-version
        bundler-cache: true
        rubygems: latest
    - name: Check the Ruby version
      run: script/check_ruby.sh
    - run: bundle exec rake audit
      env:
        RUBYOPT: -W:deprecated -W:performance

  # Requires the repository's Dependency graph to be enabled (Settings > Code security).
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: write # post the dependency review summary on the pull request
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    # Vulnerabilities, licenses and denied packages; the configuration file explains the Scorecard settings.
    - id: review
      uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
      with:
        config-file: ./.github/dependency-review.yml

    # The OpenSSF Scorecard of every added dependency, with the per-package allowances of the configuration file.
    - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
      with:
        ruby-version: .ruby-version
        rubygems: latest
    - name: Check the Ruby version
      run: script/check_ruby.sh
    - name: OpenSSF Scorecard of the added dependencies
      env:
        DEPENDENCY_CHANGES: ${{ steps.review.outputs.dependency-changes }}
        RUBYOPT: -w -W:deprecated -W:performance
      run: script/scorecard_check

  gitleaks:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    # The pinned release binary is run directly: the gitleaks action still runs on a deprecated Node.js
    # version and logs deprecation warnings. The archive is verified against its published SHA-256 first.
    - name: Install gitleaks 8.30.1
      env:
        GITLEAKS_VERSION: 8.30.1
        GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb # gitleaks_8.30.1_linux_x64.tar.gz
      run: |
        archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
        curl --fail --silent --show-error --location --output "$RUNNER_TEMP/$archive" \
          "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
        echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
        tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks

    - name: Scan the full history for secrets
      run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 .'

  warning-gate:
    name: Warning gate
    if: ${{ !cancelled() }}
    needs: [bundler-audit, dependency-review, gitleaks]
    runs-on: ubuntu-26.04
    permissions:
      actions: read # reads the logs of the other jobs of this run
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Fail on any warning or deprecation in the logs of this run
      env:
        GH_TOKEN: ${{ github.token }}
        GATE_JOB_NAME: Warning gate
      run: script/warning_gate.sh
