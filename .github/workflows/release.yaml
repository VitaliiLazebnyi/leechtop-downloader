name: Release

on:
  push:
    tags:
      - "v*.*.*" # Triggers on semantic version tags like v1.0.0

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create a GitHub Release
      id-token: write # Required for OIDC Trusted Publishing
    steps:
      - uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.4"
          bundler-cache: true

      - name: Set Release Version
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          sed -i "s/VERSION = '.*'/VERSION = '$TAG_VERSION'/" lib/leechtop_downloader/version.rb

      - name: Setup Gem Signing
        env:
          GEM_PRIVATE_KEY: ${{ secrets.GEM_PRIVATE_KEY }}
        run: |
          if [ -z "$GEM_PRIVATE_KEY" ]; then
            echo "::error title=Missing Gem Signing Key::GEM_PRIVATE_KEY secret is not set. Execution cannot continue because the gem must be signed."
            exit 1
          else
            mkdir -p ~/.gem
            # Ensure newlines are preserved by using printf
            printf "%s\n" "$GEM_PRIVATE_KEY" > ~/.gem/gem-private_key.pem
            chmod 0600 ~/.gem/gem-private_key.pem
            
            # Validate the key format
            if ! openssl rsa -in ~/.gem/gem-private_key.pem -check -noout > /dev/null 2>&1; then
              echo "::error title=Invalid Gem Signing Key::The GEM_PRIVATE_KEY provided is not a valid unencrypted RSA private key. Check for missing newlines or incorrect copy-pasting."
              exit 1
            fi
          fi

      - name: Build Gem
        run: gem build leechtop_downloader.gemspec

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: "*.gem"
          generate_release_notes: true

      - name: Configure RubyGems Credentials
        uses: rubygems/configure-rubygems-credentials@v2.0.0
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Publish to RubyGems
        run: gem push *.gem
