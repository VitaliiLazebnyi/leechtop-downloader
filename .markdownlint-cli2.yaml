---
# markdownlint-cli2 (https://github.com/DavidAnson/markdownlint-cli2): every rule is enabled, with no inline
# disable comments (script/forbidden_suppressions.sh).
config:
  # Prose, tables and code blocks wrap at 120 columns, the line length RuboCop enforces for the code.
  MD013:
    code_blocks: true
    line_length: 120
    tables: true
  default: true
globs:
  - '**/*.md'
ignores:
  - .yardoc/**
  - coverage/**
  - doc/**
  - tmp/**
  - tools/node_modules/**
  - vendor/**
...
